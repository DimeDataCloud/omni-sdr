name = "omnisdr-demo-mvp"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Hostname is demo.omnisdr.com (attach at deploy, with Christian's approval). Never mvp.omnisdr.com: it belongs to the Lead Engine inbox (Worker omnisdr-mvp).
# All state (caps, session logs, kill switch, login throttle, dev sessions) lives in one Durable Object so updates are serialized.
[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[vars]
DAILY_CAP = "10"
IP_CAP = "2"
SESSION_SECONDS = "180"
KILL = "0"
TRYME_GATED = "on"
ENGINE_B = "0"
TURNSTILE_SITEKEY = "0x4AAAAAAFkPgjzo9EQJoOUI"
# Rep portal sign-in (Cloudflare Access on demo.omnisdr.com/rep*). Empty means /rep refuses everyone: fail closed until set.
ACCESS_TEAM = ""
ACCESS_AUD = ""

# Rep portal records. Schema: migrations/rep/*.sql, applied by Halo at deploy. The owner's admin email is the
# REP_ADMIN_EMAIL secret, never a var: this repo is public.
[[d1_databases]]
binding = "REP_DB"
database_name = "omnisdr-rep"
database_id = "5e05220e-0710-41d0-ab84-6fcb5952570f"
migrations_dir = "migrations/rep"

[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.txt"]
fallthrough = true
