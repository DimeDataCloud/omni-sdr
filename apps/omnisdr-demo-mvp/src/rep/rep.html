<style nonce="__NONCE__">__CSS__

/* omnisdr.com language (Christian 2026-10-29, via Halo): sand page, white cards on a hairline, pill controls, tight headings,

@media (prefers-color-scheme:light){:root{--bg:#F5F3EF}}

.ofhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}.ofhead h1,.ofhead h2{margin:0}
ol.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;counter-reset:st;-webkit-overflow-scrolling:touch}ol.steps::-webkit-scrollbar{display:none}

.radios input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--ink)}.radios label:has(input:checked){border-color:var(--ink);background:var(--ok-soft)}

.lbl{display:block;font-weight:500;font-size:13px;margin:12px 0 6px}.fixed{margin:0;min-height:22px}.errtext{color:var(--danger)}#ofSaved{font-size:13px}.ofpre{margin:16px 0}.ofpre:empty{display:none}.card>details:only-child{border-top:0;padding:0}
details.card{padding-top:var(--sp-3);padding-bottom:var(--sp-3)}details.card>summary{min-height:44px;list-style:none;gap:12px}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform var(--t-hover) ease}details.card[open]>summary::after{transform:translateY(2px) rotate(-135deg)}details.card>.stack{margin-top:8px}

  .wrap{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.sheet{gap:8px}#view.enter{animation:none}}

<body><div class="wrap">
<header class="top"><div class="brand">__LOGO__<b>OmniSDR · Rep</b></div><span class="muted" id="who"></span></header>
<nav class="main" id="nav" aria-label="Rep portal">
  <a href="#today" data-g="home">Home</a><a href="#calls" data-g="sales">Sales</a><a href="#playbook" data-g="learn">Learn</a><a href="#deals" data-g="deals">My deals</a><a href="#team" hidden id="navTeam" data-g="team">Team</a>
</nav>
<nav class="main tier2" id="subnav" aria-label="Section" hidden></nav>
<div class="row viewbar" id="viewbar" hidden><label for="vw">Viewing</label><select id="vw"></select></div>
<main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script nonce="__NONCE__">
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
let ME = null, K = null; // who is signed in; content (prices, playbook, stages)
// Admin only: the team list and whose data the screens show ('' = everyone). Reps always see only their own; the server enforces it.
let REPS = [], VIEW = '';
const repName = (e) => (REPS.find((r) => r.email === e) || {}).name || e;
const repOptions = (sel, onlyActive = true) => REPS.filter((r) => !onlyActive || r.active).map((r) => `<option value="${esc(r.email)}"${r.email === sel ? ' selected' : ''}>${esc(r.name)}${r.email === ME.email ? ' (you)' : ''}</option>`).join('');

async function api(path, { method = 'GET', body, raw = false, noView = false } = {}) {
  if (method === 'GET' && VIEW && !noView) path += (path.includes('?') ? '&' : '?') + 'owner=' + encodeURIComponent(VIEW);
  const r = await fetch('/rep/api' + path, { method, credentials: 'same-origin', headers: { 'x-rep': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (raw && r.ok) return r;
  const j = await r.json().catch(() => ({ message: 'The server sent something unexpected.' }));
  if (r.status === 401) { location.reload(); throw new Error('Signed out'); } // Access sends them to sign in again
  if (!r.ok) throw new Error(j.message || 'Something went wrong.');
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
const fail = (e) => toast(e.message);
const when = (iso) => iso ? new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const day = (iso) => new Date(iso).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const local = (iso) => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromLocal = (v) => v ? new Date(v).toISOString() : null;
const label = (code) => String(code).replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
const STAGE_LABEL = { new: 'New', results_call: 'Demo booked', proposed: 'Proposed', onboarding: 'Onboarding', live: 'Live', lost: 'Lost' };
const OUTCOME_LABEL = { interested: 'Demo booked' };
const DIAL_WHY = { do_not_call: 'Marked do not call.', no_phone: 'No phone on file.', unscrubbed: 'Not cleared to call yet: this number has no Do Not Call scrub on record.', scrub_expired: 'Not cleared to call: the Do Not Call scrub is over 31 days old.' };
const FLAGS = [['do_not_call', 'Do not call'], ['wrong_number', 'Wrong number'], ['closed', 'Closed'], ['already_covered', 'Already covered'], ['not_fit', 'Not a fit']];
const flagBtns = (id) => FLAGS.map(([k, l]) => `<button class="btn ghost sm" type="button" data-flag="${k}" data-id="${esc(id)}">${l}</button>`).join('');
// Do not call and wrong number are permanent and the number leaves the queue at once; the other three close the lead as lost.
async function setFlag(id, kind) { await api('/accounts/' + encodeURIComponent(id) + '/flag', { method: 'POST', body: { kind } }); toast('Saved'); }
// One stage picker for Pipeline cards and the account header. Onboarding and Live are admin moves; the server refuses them for reps too.
const stageOptions = (cur) => K.stages.map((s) => `<option value="${s}"${s === cur ? ' selected' : ''}${['onboarding', 'live'].includes(s) && ME.role !== 'admin' ? ' disabled' : ''}>${STAGE_LABEL[s]}</option>`).join('');
// Account tabs by name, for #account/<id>/<tab> links and for keeping the open tab across a save.
const ACCOUNT_TAB = { details: '0', audit: '4', messages: '5', timeline: '1', onboarding: '2', close: '3' };
const money = (c) => '$' + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const form = (f) => Object.fromEntries(new FormData(f).entries());
const ul = (items, cls = 'tight') => `<ul class="${cls}">${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
const ol = (items) => `<ol class="tight">${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ol>`;
// Fill {business}, {name} and {rep}; anything in [brackets] is left for the rep to fill in.
const fill = (body, v) => body.replace(/\{(business|name|rep)\}/g, (m, k) => v[k] || m);
const tpls = (v) => K.templates.map((t) => `<section class="card stack"><h2>${esc(t.label)}</h2><pre class="tpl" id="tp_${t.id}">${esc(fill(t.body, v))}</pre>
  <div class="row"><button class="btn ghost sm" type="button" data-copy="tp_${t.id}">Copy</button>${v.account ? `<button class="btn ghost sm" type="button" data-sent="${t.id}">Log it as sent</button>` : ''}</div></section>`).join('');
async function copyText(id) {
  const el = document.getElementById(id); if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent); toast('Copied'); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Copy it now.'); }
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });

// The lost-job estimate on the Audit tab, from the owner's own numbers (strings as typed, maybe empty).
// Return the sentence to show, or '' when there is not enough to say anything.
// Christian 2026-10-27: no doubt words and no promises. State the owner's own math and call it theirs.
function lostJobs(jobValue, missed) {
  // "$8,500" -> 8500; a range like "3-4" takes the low end so the figure never overstates.
  const num = (v) => { const m = String(v || '').replace(/[$,\s]/g, '').match(/\d+(\.\d+)?/); return m ? Number(m[0]) : 0; };
  const value = Math.round(num(jobValue)), leads = Math.floor(num(missed)); // whole dollars, whole leads
  if (!value || !leads) return '';
  const cents = Math.round(value * leads * 100);
  return `By your numbers: ${leads} missed ${leads === 1 ? 'lead' : 'leads'} a month × ${money(Math.round(value * 100))} a job = ${money(cents)} a month in jobs at stake.`;
}

// Which accounts the Today screen calls "hot": open deals worth a call today.
// a has: stage, last_touch_at, next_action_at, updated_at, created_at (ISO strings or null), signal, next_step.
function isHot(a, now = Date.now()) {
  // Christian 2026-10-27: money on the table (demo booked, proposal) is always hot; a new lead reached in the last 48 hours is warm.
  if (!['results_call', 'proposed'].includes(a.stage)) return a.stage === 'new' && Date.parse(a.last_touch_at) > now - 2 * 864e5;
  return true;
}

// ── Guided deal flow (Christian 2026-10-29, via Halo) ───────────────────────────────────────────────────────────────────
// One Order Form per deal, typed once and saved as you go: package (the quote), client, services, term, review and sign,
// hand-off. Field lists come from /content (src/rep/orderform.js), prices from content.js and the mix from mix.js; the
// server checks every value again, so nothing here decides a price or who may quote what.
const OF_STEPS = [['package', 'Package'], ['client', 'Client'], ['services', 'Services'], ['term', 'Term and payment'], ['review', 'Review and sign'], ['handoff', 'Hand-off']];
const OF_STATUS = { draft: ['Draft', ''], client_review: ['Client filled in, review', 'warn'], filed: ['Filed', ''], void: ['Void', 'bad'] };
const OF_TITLE = { client: 'Client details', services: 'Services and setup', term: 'Term and payment', signing: 'Signing' };
const PLAN_LEVEL = { Lite: 1, Standard: 2, Plus: 3, Agency: 4 }; // the price level a filed plan closes at
const planName = (p) => (p === 'Custom' ? 'Custom Build' : p || '');
const levelName = (l) => ({1:'Lite',2:'Standard',3:'Plus',4:'Agency'}[l] || `Level ${l}`);
const ofPill = (s) => `<span class="pill ${OF_STATUS[s][1]}">${OF_STATUS[s][0]}</span>`;
const dollars = (v) => { const s = String(v ?? '').replace(/[$,\s]/g, ''); if (!s) return null; const n = Number(s); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
// One field. Names are "<section>.<key>", so a section reads back with ofRead.
function ofField(sec, f, v) {
  const id = `of_${sec}_${f.key}`, name = `${sec}.${f.key}`, req = f.req ? ' *' : '';
  const help = f.help ? `<p class="help" id="${id}_h">${esc(f.help)}</p>` : '', desc = f.help ? ` aria-describedby="${id}_h"` : '';
  if (f.kind === 'bool') return `<label class="check full"><input type="checkbox" id="${id}" name="${name}"${v ? ' checked' : ''}> ${esc(f.label)}</label>`;
  if (f.kind === 'choice') return `<fieldset class="full radiogroup"${desc}><legend>${esc(f.label)}${req}</legend><div class="radios">${Object.entries(f.options).map(([k, l]) => `<label><input type="radio" name="${name}" value="${esc(k)}"${v === k ? ' checked' : ''}> ${esc(l)}</label>`).join('')}</div>${help}</fieldset>`;
  const wide = (f.max || 0) > 120 || f.kind === 'email' ? 'full' : '', type = f.kind === 'email' ? 'email' : f.kind === 'date' ? 'date' : 'text';
  const extra = f.kind === 'state' ? ' maxlength="2" autocapitalize="characters"' : f.max ? ` maxlength="${f.max}"` : '';
  return `<div class="${f.help ? 'full' : wide}"><label for="${id}">${esc(f.label)}${req}</label>${(f.max || 0) > 300 ? `<textarea id="${id}" name="${name}" rows="3"${extra}${desc}>${esc(v)}</textarea>` : `<input id="${id}" name="${name}" type="${type}"${extra} value="${esc(v)}"${desc}>`}${help}</div>`;
}
// An admin-only field as a rep sees it: the value, never an input. The server refuses a rep's value and keeps the admin's.
const ofFixed = (f, v) => `<div class="full"><span class="lbl">${esc(f.label)}</span><p class="fixed">${v != null && v !== '' ? esc(ofShow(f, v)) : '<span class="muted">Not recorded yet. An admin records it.</span>'}</p></div>`;
const ofFields = (sec, data, admin) => K.orderForm.sections[sec].map((f) => (f.admin && !admin ? ofFixed(f, (data[sec] || {})[f.key]) : ofField(sec, f, (data[sec] || {})[f.key]))).join('');
function ofRead(el, sec) {
  const out = {};
  for (const f of K.orderForm.sections[sec]) { const x = el.elements[`${sec}.${f.key}`]; if (x) out[f.key] = f.kind === 'bool' ? x.checked : x.value; }
  return out;
}
const ofShow = (f, v) => (v == null || v === '' ? '' : f.kind === 'bool' ? (v ? 'Yes' : 'No') : f.kind === 'choice' ? f.options[v] || String(v) : String(v));
const ofPackageRows = (p = {}) => [['Plan', planName(p.plan)], ['Price', p.priceCents != null ? money(p.priceCents) + ' plus tax' : ''],
  ['Usage included', p.minutes != null ? `${p.minutes.toLocaleString()} voice minutes, ${p.texts.toLocaleString()} texts, ${p.threads.toLocaleString()} AI conversations` : ''],
  ['Discount', p.discount], ['Build fee', p.buildFee]].filter(([, v]) => v);
// The whole form as one sheet: the Review step, the print view, and what prints or saves as a PDF.
function ofSheet(F, acct) {
  const d = F.data, kv = (rows) => (rows.length ? `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '<p class="muted">Nothing yet.</p>');
  const sec = (n) => kv(K.orderForm.sections[n].map((f) => [f.label, ofShow(f, (d[n] || {})[f.key])]).filter(([, v]) => v));
  return `<div class="sheet"><section class="card"><div class="ofhead"><h2>Order Form ${esc(F.label)}</h2>${ofPill(F.status)}</div>${acct ? `<p class="muted">${esc(acct.business)}</p>` : ''}</section>
    <section class="card"><h2>Package</h2>${kv(ofPackageRows(d.package))}</section>${['client', 'services', 'term', 'signing'].map((n) => `<section class="card"><h2>${OF_TITLE[n]}</h2>${sec(n)}${n === 'term' ? `<p class="help">${esc(K.orderForm.notes.term)}</p>` : ''}</section>`).join('')}
    <p class="legal">${esc(K.orderForm.notes.summary)}</p></div>`;
}

/* ---------- screens ---------- */
const screens = {
  async today() { // the front page: today and the calendar in one panel
    view.innerHTML = '<div id="hToday"></div><div id="hCal"></div>';
    await Promise.all([screens.todayPanel($('#hToday')), screens.calendarPanel($('#hCal'))]);
  },
  calendar() { return screens.today(); },

  async todayPanel(host) {
    const [t, all] = await Promise.all([api('/today'), api('/accounts')]);
    const hot = all.accounts.filter((a) => isHot(a)).slice(0, 8);
    host.innerHTML = `<h1>Today</h1><p class="sub">Calls, callbacks and follow-ups due by end of day.</p>
      <div class="stats" id="stats"></div>
      <div class="grid two"><section class="card"><h2>Due today (${t.tasks.length})</h2><ul class="list" id="due"></ul></section>
      <section class="card"><h2>Hot accounts</h2><ul class="list" id="hot"></ul></section></div>`;
    const s = t.stages;
    $('#stats').innerHTML = [['Calls today', t.counts.attempts], ['Conversations', t.counts.conversations], ['Interested', t.counts.interested], ['Open pipeline', ['new', 'results_call', 'proposed'].reduce((n, k) => n + (s[k] || 0), 0)], ['Onboarding or live', (s.onboarding || 0) + (s.live || 0)]]
      .map(([k, v]) => `<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join('');
    $('#due').innerHTML = t.tasks.length ? t.tasks.map((k) => `<li><div class="t">${esc(k.title)}<small>${k.business ? esc(k.business) + ' · ' : ''}${when(k.due_at)}${Date.parse(k.due_at) < Date.now() - 36e5 ? ' · overdue' : ''}</small></div>
      <span class="row">${k.account_id ? `<a class="btn ghost sm" href="#account/${esc(k.account_id)}">Open</a>` : ''}<button class="btn sm" data-done="${esc(k.id)}">Done</button></span></li>`).join('') : '<li class="muted">Nothing due. Work the Call Room queue.</li>';
    $('#hot').innerHTML = hot.length ? hot.map((a) => `<li><div class="t"><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a><small>${STAGE_LABEL[a.stage]}${a.next_step ? ' · ' + esc(a.next_step) : ''}</small></div></li>`).join('') : '<li class="muted">No hot accounts right now.</li>';
    $('#due').onclick = (e) => { const b = e.target.closest('[data-done]'); if (b) api('/tasks/' + b.dataset.done, { method: 'PATCH', body: { status: 'done' } }).then(() => { toast('Done'); route(); }, fail); };
  },

  async calls() {
    const { accounts, held } = await api('/queue');
    let i = 0, outcome = null;
    const draw = () => {
      const a = accounts[i];
      if (!a) { view.innerHTML = `<h1>Call Room</h1><div class="card"><p>The queue is empty. Add accounts or import a list on the Accounts screen.${held ? ` ${held} ${held === 1 ? 'lead is' : 'leads are'} held until ${held === 1 ? 'its' : 'their'} Do Not Call scrub is recorded.` : ''}</p><a class="btn" href="#accounts">Go to Accounts</a></div>`; return; }
      outcome = null;
      view.innerHTML = `<h1>Call Room</h1><p class="sub">${i + 1} of ${accounts.length} due. One at a time.</p>
      <div class="grid two"><section class="card stack">
        <div><h2>${esc(a.business)}</h2><p class="muted">${esc([a.niche, a.city, a.state].filter(Boolean).join(' · '))} · <span class="pill">${STAGE_LABEL[a.stage]}</span></p></div>
        ${a.phone ? `<div class="row"><span class="phone">${esc(a.phone)}</span><a class="btn ghost sm" href="tel:${esc(a.phone.replace(/[^\d+]/g, ''))}">Call</a></div><p class="note">Dial by hand, 9 AM to 8 PM their local time, Monday to Saturday, not on a federal holiday. No texts to these numbers.</p><div class="row" id="fl">${flagBtns(a.id)}</div>` : '<p class="note">No phone on file. Add one on the account.</p>'}
        ${a.contact_name ? `<p>Ask for <b>${esc(a.contact_name)}</b></p>` : ''}
        ${a.signal ? `<p><span class="muted">Why we are calling:</span> ${esc(a.signal)}</p>` : ''}
        ${a.notes ? `<p class="muted script">${esc(a.notes)}</p>` : ''}
        <div><h2>How did it go?</h2><div class="outcomes" id="oc">${K.outcomes.map((o) => `<button class="btn ghost" data-o="${o}" aria-pressed="false">${OUTCOME_LABEL[o] || label(o)}</button>`).join('')}</div><p class="muted">Press 1 to ${K.outcomes.length} to pick, Enter to log.</p></div>
        <div id="cbBox" hidden><label for="cb">Callback time</label><input type="datetime-local" id="cb"></div>
        <div><label for="cn">Note</label><textarea id="cn" rows="3" maxlength="1000" placeholder="What they said, who to ask for, best time"></textarea></div>
        <div class="row"><button class="btn" id="log" disabled>Log call and next</button><button class="btn ghost" id="skip">Skip</button><a class="lnk" href="#account/${esc(a.id)}">Open account</a></div>
      </section>
      <section class="card stack"><h2>Opener</h2><p class="script">${esc(K.opener)}</p>
        <div>${K.objections.map((o) => `<details><summary>${esc(o.heard)}</summary><p>${esc(o.answer)}</p></details>`).join('')}</div>
        <p class="note">${esc(K.method)}</p></section></div>`;
      $('#oc').onclick = (e) => { const b = e.target.closest('[data-o]'); if (!b) return; outcome = b.dataset.o; $$('#oc [data-o]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); $('#cbBox').hidden = outcome !== 'callback_scheduled'; $('#log').disabled = false; };
      $('#skip').onclick = () => { i++; draw(); };
      if ($('#fl')) $('#fl').onclick = async (e) => { const b = e.target.closest('[data-flag]'); if (!b) return; try { await setFlag(b.dataset.id, b.dataset.flag); accounts.splice(i, 1); draw(); } catch (er) { fail(er); } };
      $('#log').onclick = async () => {
        $('#log').disabled = true;
        try { const r = await api('/calls', { method: 'POST', body: { accountId: a.id, outcome, note: $('#cn').value, callbackAt: fromLocal($('#cb').value) } });
          toast(r.task ? `Logged. Next: ${r.task.title}, ${when(r.task.dueAt)}` : 'Logged'); i++; draw();
        } catch (e) { fail(e); $('#log').disabled = false; }
      };
    };
    draw();
    clearCallsKey();
    callsKeyHandler = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea,select,[contenteditable]')) return;
      if (/^[1-9]$/.test(e.key)) { const b = $$('#oc [data-o]')[Number(e.key) - 1]; if (b) b.click(); }
      // A focused button, link or summary keeps its own Enter; logging on top of it could post the call twice.
      else if (e.key === 'Enter' && !e.target.closest('button,a,summary')) { const lg = $('#log'); if (lg && !lg.disabled) { e.preventDefault(); lg.click(); } }
    };
    document.addEventListener('keydown', callsKeyHandler);
  },

  async pipeline() {
    const { accounts } = await api('/accounts');
    const stages = K.stages.filter((s) => s !== 'lost');
    view.innerHTML = `<h1>Pipeline</h1><p class="sub">Change the stage on a card to move it. Onboarding and Live are set by Christian.</p><div class="board" id="board">${stages.map((st) => {
      const list = accounts.filter((a) => a.stage === st);
      return `<section class="col"><h2>${STAGE_LABEL[st]}<span>${list.length}</span></h2>${list.map((a) => `<div class="mini"><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a>
        <small class="muted">${esc(a.next_step || a.niche || '')}</small><select data-id="${esc(a.id)}" aria-label="Stage for ${esc(a.business)}">${stageOptions(a.stage)}</select>${['results_call', 'proposed'].includes(a.stage) ? `<a class="lnk" href="#account/${esc(a.id)}/close">Close the sale</a>` : ''}</div>`).join('')}</section>`;
    }).join('')}</div>`;
    $('#board').onchange = (e) => { const s = e.target.closest('select[data-id]'); if (s) api('/accounts/' + s.dataset.id, { method: 'PATCH', body: { stage: s.value } }).then(() => { toast('Moved'); route(); }, fail); };
  },

  // Accounts and Leads in one list. Reps see their own rows; admins see everyone, or one rep through the Viewing switch,
  // which the Rep filter drives. Reps can bulk-set the category on their own rows; assign, split, archive and Import for
  // are admin only. Controls a role cannot use are not rendered, and the server refuses them anyway.
  async accounts() {
    const admin = ME.role === 'admin', picked = new Set();
    let rows = [], facets = { niche: [], state: [], owner: [], pool: 0, total: 0 };
    const KEEP = 'rep.accounts', F = { q: '', st: '', ni: '', sa: '', pool: false, arch: false };
    try { Object.assign(F, JSON.parse(sessionStorage.getItem(KEEP) || '{}')); } catch {}
    if (!admin || VIEW) F.pool = false;
    if (!admin) F.arch = false;
    const keep = () => { try { sessionStorage.setItem(KEEP, JSON.stringify(F)); } catch {} }; // this tab only, never sent anywhere
    view.innerHTML = `<h1>Accounts</h1><p class="sub">${admin ? 'Every lead and account in the book. Filter, sort into categories and hand them out.' : 'Every business you are working, prospect to live.'}</p>
      ${admin ? '<div class="stats" id="tiles"></div>' : ''}
      <section class="card stack"><div class="row"><input class="grow" id="q" type="search" placeholder="Search name, category, city or phone" aria-label="Search accounts">
        <select id="st" aria-label="Stage" class="grow"><option value="">All stages</option>${K.stages.map((s) => `<option value="${s}">${STAGE_LABEL[s]}</option>`).join('')}</select>
        <select id="sa" aria-label="State" class="grow"><option value="">All states</option></select></div>
        <div><p class="muted">Category</p><div class="chips" id="fNiche"></div></div>
        ${admin ? '<div><p class="muted">Rep</p><div class="chips" id="fOwner"></div></div><div><p class="muted">Show</p><div class="chips" id="fArch"><button class="chip" type="button" data-k="0">Active</button><button class="chip" type="button" data-k="1">Archived</button></div></div>' : ''}
        <div class="row"><button class="btn" id="add" type="button">New account</button><label class="btn ghost" for="csv">Import CSV</label><input id="csv" type="file" accept=".csv,text/csv" class="sr">${admin ? '<button class="btn ghost" id="exp" type="button">Export CSV</button>' : ''}${admin ? `<label for="impOwner" class="muted">Import for</label><select id="impOwner" class="grow">${repOptions(ME.email)}</select>` : ''}</div></section>
      <section class="card"><p class="muted" id="count" aria-live="polite"></p>
        <div class="tbl"><table><thead><tr><th class="sel"><input type="checkbox" id="selAll" aria-label="Select all shown"></th><th>Business</th><th>Stage</th><th class="hide-sm">Next</th><th class="hide-sm">Phone</th>${admin ? '<th>Rep</th>' : ''}</tr></thead><tbody id="rows"></tbody></table></div></section>
      <section class="card stack bulk" id="bulk" hidden><div class="row"><b id="selN"></b><button class="btn ghost sm" id="selNone" type="button">Clear</button></div>
        ${admin ? `<div class="row live"><label for="assignTo" class="muted">Assign to</label><select id="assignTo" class="grow"><option value="">Pick a rep</option>${repOptions('')}</select><button class="btn" id="doAssign" type="button">Assign</button></div>
        <details class="live"><summary>Split evenly between reps</summary><div class="splitlist" id="split">${REPS.filter((r) => r.active).map((r) => `<label class="row"><input type="checkbox" value="${esc(r.email)}"> ${esc(r.name)}</label>`).join('')}</div><button class="btn ghost" id="splitGo" type="button">Split</button></details>` : ''}
        <div class="row live"><label for="cat" class="muted">Set category</label><input id="cat" class="grow" list="cats" maxlength="80" placeholder="Remodeler, Generator dealer"><datalist id="cats"></datalist><button class="btn ghost" id="catGo" type="button">Set</button>${admin ? '<button class="btn ghost" id="arch" type="button">Archive</button>' : ''}</div>
        ${admin ? '<div class="row"><label for="scrubLt" class="muted">Record scrub</label><select id="scrubLt" aria-label="Line type"><option value="">Keep line type</option><option value="landline">Landline</option><option value="wireless">Wireless</option><option value="voip">VoIP</option><option value="unknown">Unknown</option></select><button class="btn ghost" id="scrubGo" type="button">Scrubbed today</button></div><div class="row" id="restoreRow" hidden><button class="btn" id="restoreGo" type="button">Restore</button></div><div class="row" id="archAsk" hidden><span id="archQ"></span><button class="btn danger" id="archGo" type="button">Archive</button><button class="btn ghost" id="archNo" type="button">Cancel</button></div>' : ''}</section>
      <dialog id="dlg"><form id="nf" class="stack"><h2>New account</h2><div class="fields">
        <div class="full"><label for="nb">Business name</label><input id="nb" name="business" required maxlength="160"></div>
        <div><label for="nn">Category</label><input id="nn" name="niche" maxlength="80" placeholder="Remodeler, HVAC, med spa"></div>
        <div><label for="np">Phone</label><input id="np" name="phone" type="tel" maxlength="40"></div>
        <div><label for="nc">Owner or contact</label><input id="nc" name="contact" maxlength="120"></div>
        <div><label for="nw">Website</label><input id="nw" name="website" maxlength="300"></div>
        <div><label for="ny">City</label><input id="ny" name="city" maxlength="80"></div>
        <div><label for="ns">State</label><input id="ns" name="state" maxlength="40"></div>
        <div class="full"><label for="ng">Why we are calling (the signal)</label><input id="ng" name="signal" maxlength="300" placeholder="Form went unanswered 6 hours on a Tuesday"></div>
      </div><div class="row"><button class="btn">Save</button><button class="btn ghost" type="button" id="cx">Cancel</button></div></form></dialog>`;
    // Counts describe active rows, so the Archived view shows the chips without numbers.
    const chip = (key, text, n, on) => `<button class="chip" type="button" data-k="${esc(key)}" aria-pressed="${on}">${esc(text)}${F.arch ? '' : ` <b>${n}</b>`}</button>`;
    // The server counts: every lead for an admin, the rep's own rows for a rep.
    const loadFacets = async () => { facets = await api('/leads/facets', { noView: true }); };
    // A filter restored from the session but missing from the counts still shows as pressed, so it is never invisible.
    const drawFacets = () => {
      const x = facets, ni = x.niche.map((r) => ({ k: r.key || '(none)', t: r.key || 'No category', n: r.n }));
      if (F.ni && !ni.some((r) => r.k === F.ni)) ni.push({ k: F.ni, t: F.ni === '(none)' ? 'No category' : F.ni, n: 0 });
      $('#fNiche').innerHTML = chip('', 'All', x.total, F.ni === '') + ni.map((r) => chip(r.k, r.t, r.n, F.ni === r.k)).join('');
      const sa = $('#sa'); sa.innerHTML = '<option value="">All states</option>' + x.state.filter((r) => r.key).map((r) => `<option value="${esc(r.key)}">${esc(r.key)} (${r.n})</option>`).join('');
      if (F.sa && ![...sa.options].some((o) => o.value === F.sa)) sa.add(new Option(F.sa, F.sa)); sa.value = F.sa;
      $('#cats').innerHTML = x.niche.filter((r) => r.key).map((r) => `<option value="${esc(r.key)}">`).join('');
      if (!admin) return;
      $('#tiles').innerHTML = [['Leads', x.total], ['Waiting to hand out', x.pool], ['Categories', x.niche.filter((r) => r.key).length], ['Reps with leads', x.owner.filter((r) => (REPS.find((p) => p.email === r.key) || {}).role !== 'admin').length]]
        .map(([k, v]) => `<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join('');
      const own = x.owner.map((r) => ({ k: r.key, n: r.n })); if (VIEW && !own.some((r) => r.k === VIEW)) own.push({ k: VIEW, n: 0 });
      $('#fOwner').innerHTML = chip('', 'All', x.total, !VIEW && !F.pool) + chip('pool', 'Waiting to hand out', x.pool, F.pool) + own.map((r) => chip(r.k, repName(r.k), r.n, VIEW === r.k)).join('');
      $$('#fArch .chip').forEach((c) => c.setAttribute('aria-pressed', String((c.dataset.k === '1') === F.arch)));
    };
    const sync = () => {
      $$('[data-sel]').forEach((c) => (c.checked = picked.has(c.dataset.sel)));
      $('#selAll').checked = rows.length > 0 && rows.every((a) => picked.has(a.id));
      $('#bulk').hidden = !picked.size; $('#selN').textContent = picked.size + ' selected';
      if (admin) { $('#archAsk').hidden = true; $('#restoreRow').hidden = !F.arch; $$('#bulk .live').forEach((el) => (el.hidden = F.arch)); }
    };
    // Category and place under the name; on a phone the Phone column folds in here instead of wrapping over three lines.
    const line = (a) => { const t = esc([a.niche, [a.city, a.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ')); return t + (a.phone ? `<span class="show-sm">${t ? ' · ' : ''}${esc(a.phone)}</span>` : ''); };
    const load = async () => {
      const p = new URLSearchParams();
      if (F.q) p.set('q', F.q); if (F.st) p.set('stage', F.st); if (F.ni) p.set('niche', F.ni); if (F.sa) p.set('state', F.sa); if (admin && F.pool) p.set('pool', '1'); if (admin && F.arch) p.set('archived', '1');
      rows = (await api('/accounts?' + p)).accounts;
      for (const id of [...picked]) if (!rows.some((a) => a.id === id)) picked.delete(id); // bulk actions only ever touch rows on screen
      $('#count').textContent = rows.length === 500 ? '500 shown. Narrow the filter to see the rest.' : rows.length + (F.arch ? ' archived shown' : ' shown');
      $('#rows').innerHTML = rows.length ? rows.map((a) => `<tr data-id="${esc(a.id)}"><td class="sel"><input type="checkbox" data-sel="${esc(a.id)}" aria-label="Select ${esc(a.business)}"></td><td><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a><br><small class="muted">${line(a)}</small></td><td>${STAGE_LABEL[a.stage] || ''}</td><td class="hide-sm">${esc(a.next_step)}<br><small class="muted">${when(a.next_action_at)}</small></td><td class="hide-sm">${esc(a.phone)}</td>${admin ? `<td>${esc(repName(a.owner_email))}</td>` : ''}</tr>`).join('') : `<tr><td colspan="${admin ? 6 : 5}" class="muted">${F.arch ? 'No archived accounts match.' : 'No accounts match.'}</td></tr>`;
      sync();

  async kit() {

      <section class="card stack"><h2>Say this</h2><p>${esc(H.say)}</p><a class="btn" href="/tryme" target="_blank" rel="noopener">Open the live demo</a></section>`;

  async team() {
    if (ME.role !== 'admin') { location.hash = 'today'; return; }
    const { reps } = await api('/reps'); REPS = reps; fillView();
    const n = (r, k) => r.stats.stages[k] || 0;
    // One list of columns: the table headings on a wide screen, and each number's label on a phone card.
    const COLS = [['Leads', (r) => r.stats.leads], ['New', (r) => n(r, 'new')], ['Demo booked', (r) => n(r, 'results_call')], ['Proposed', (r) => n(r, 'proposed')],
      ['Onboarding or live', (r) => n(r, 'onboarding') + n(r, 'live')], ['Open tasks', (r) => r.stats.openTasks], ['Calls, 7 days', (r) => r.stats.calls7d], ['Deals', (r) => r.stats.deals], ['Sold', (r) => money(r.stats.soldCents)]];

      <section class="card"><div class="tbl cards"><table role="table"><thead><tr role="row"><th role="columnheader">Rep</th>${COLS.map(([l]) => `<th role="columnheader">${l}</th>`).join('')}<th role="columnheader"><span class="sr">Actions</span></th></tr></thead><tbody>${reps.filter((r) => r.active).map((r) => `<tr role="row"><td role="cell" class="who">${esc(r.name)}</td>${COLS.map(([l, f]) => `<td role="cell" data-label="${l}">${f(r)}</td>`).join('')}<td role="cell" class="act"><button class="btn ghost sm" data-view="${esc(r.email)}">View as<span class="sr"> ${esc(r.name)}</span></button></td></tr>`).join('')}</tbody></table></div></section>
      <p class="note">New reps also need their email on the Cloudflare Access "Reps" policy before they can sign in.</p><div class="grid two">
      <section class="card"><ul class="list" id="reps">${reps.map((r) => `<li><div class="t">${esc(r.name)} <span class="pill${r.active ? '' : ' bad'}">${r.active ? esc(r.role) : 'off'}</span><small>${esc(r.email)}</small></div>${r.email === ME.email ? '' : `<button class="btn ghost sm" data-e="${esc(r.email)}" data-a="${r.active ? 0 : 1}">${r.active ? 'Turn off' : 'Turn on'}</button>`}</li>`).join('')}</ul></section>
      <form class="card" id="rf"><h2>Add a rep</h2><label for="r_n">Name</label><input id="r_n" name="name" required maxlength="80"><label for="r_e">Email they sign in with</label><input id="r_e" name="email" type="email" required>
        <label for="r_r">Role</label><select id="r_r" name="role"><option value="rep">Rep</option><option value="admin">Admin</option></select><p><button class="btn">Add</button></p></form></div>`;
    view.querySelector('.tbl').onclick = (e) => { const b = e.target.closest('[data-view]'); if (b) { setView(b.dataset.view); location.hash = 'accounts'; } };
    $('#reps').onclick = (e) => { const b = e.target.closest('[data-e]'); if (b) api('/reps/' + encodeURIComponent(b.dataset.e), { method: 'PATCH', body: { active: b.dataset.a === '1' } }).then(() => { toast('Updated'); route(); }, fail); };
    $('#rf').onsubmit = (e) => { e.preventDefault(); api('/reps', { method: 'POST', body: form(e.target) }).then(() => { toast('Added'); route(); }, fail); };
  },

  // Admin only. Sweeps run on GitHub Actions and land here as staged leads; nothing becomes an account until an admin adds it.
  async engine(arg) {
    if (ME.role !== 'admin') { location.hash = 'today'; return; }
    clearTimeout(screens.engine.t);
    const [cfg, { jobs }] = await Promise.all([api('/engine/config', { noView: true }), api('/engine/jobs', { noView: true })]);
    const open = arg ? jobs.find((j) => j.id === arg) : null, results = open ? (await api('/engine/jobs/' + encodeURIComponent(open.id) + '/results', { noView: true })).results : [];
    const STATUS = { queued: 'Waiting', running: 'Running', done: 'Done', failed: 'Failed' };
    const row = (j) => `<tr><td${j.kind === 'scan' ? ' colspan="2"' : ''}>${j.kind === 'scan' ? 'Link: ' + esc(j.url) : esc(j.zip)}</td>${j.kind === 'scan' ? '' : `<td>${esc(j.niche)}</td>`}<td><span class="pill${j.status === 'failed' ? ' bad' : ''}">${STATUS[j.status] || esc(j.status)}</span></td><td>${j.staged}</td><td>${j.added}</td><td>${esc(when(j.created_at))}</td><td><a class="btn ghost sm" href="#engine/${esc(j.id)}">Open</a></td></tr>`;
    const lead = (r) => { const l = r.lead; return `<li><div class="t">${esc(l.business)} <small>${esc([l.niche, l.city, l.state].filter(Boolean).join(', '))}</small><small>${esc(l.phone)}${l.website ? ' · ' + esc(l.website) : ''}</small>${l.signal ? `<small>${esc(l.signal)}</small>` : ''}</div>${r.state === 'staged' ? `<span class="row"><button class="btn sm" data-add="${esc(r.id)}">Add</button><button class="btn ghost sm" data-no="${esc(r.id)}">Dismiss</button></span>` : `<span class="pill">${r.state === 'added' ? 'Added' : 'Dismissed'}</span>`}</li>`; };
    const staged = results.filter((r) => r.state === 'staged').length;
    view.innerHTML = `<h1>Lead Engine</h1><p class="sub">Pick a ZIP and a niche. The engine finds local businesses, scores their websites and sends back the ones worth calling. Results wait here until you add them.</p>
      ${cfg.connected ? '' : '<p class="note">Sweeps are not connected yet. A job you start is saved and waits until the owner finishes setup.</p>'}
      <form class="card" id="sf"><h2>Scan one link</h2><p class="muted">Paste a business's own website. The engine reads it once, politely (robots.txt respected, one request every few seconds) and scores it. Google Business Profile links are never read. Nothing is added until you click Add.</p>
        <label for="s_u">Website address</label><input id="s_u" name="url" type="url" required placeholder="https://example.com"><p><button class="btn">Scan link</button></p><div id="sr" aria-live="polite"></div></form>
      <form class="card" id="ef"><h2>Start a sweep</h2><div class="grid two"><div><label for="e_z">ZIP code</label><input id="e_z" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="07030"><p class="muted">New Jersey and Tennessee ZIPs.</p></div>
        <div><label for="e_n">Niche</label><select id="e_n" name="niche" required>${cfg.niches.map((n) => `<option>${esc(n)}</option>`).join('')}</select></div></div>
        <label for="e_c">Most leads to keep</label><input id="e_c" name="cap" type="number" min="1" max="${cfg.maxCap}" value="${cfg.defaultCap}"><p><button class="btn">Start sweep</button></p></form>
      ${open ? `<section class="card stack"><h2>${open.kind === 'scan' ? 'Link scan' : esc(open.niche) + ' in ' + esc(open.zip)}</h2><p class="muted">${STATUS[open.status] || esc(open.status)}${open.error ? '. ' + esc(open.error) : ''}${open.status === 'done' ? `. Found ${esc(open.summary.solid ?? 0)} solid, ${esc(open.summary.staged ?? 0)} new, ${esc(open.summary.duplicates ?? 0)} already on file.` : ''}</p>
        ${results.length ? `<p class="row"><button class="btn" id="addAll"${staged ? '' : ' disabled'}>Add all ${staged} to accounts</button></p><ul class="list" id="rs">${results.map(lead).join('')}</ul>` : '<p class="muted">Nothing here yet.</p>'}</section>` : ''}
      <section class="card"><h2>Recent sweeps</h2>${jobs.length ? `<div class="tbl"><table><thead><tr><th>ZIP</th><th>Niche</th><th>Status</th><th>Waiting</th><th>Added</th><th>Started</th><th></th></tr></thead><tbody>${jobs.map(row).join('')}</tbody></table></div>` : '<p class="muted">No sweeps yet.</p>'}</section>`;
    $('#sf').onsubmit = (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; $('#sr').innerHTML = '<p class="muted">Reading the site. This takes up to half a minute.</p>';
      api('/engine/scan', { method: 'POST', body: { url: form(e.target).url } }).then((r) => {
        const x = r.result, ev = x.evidence || {}, line = (l, v) => v ? `<li><div class="t">${l}<small>${esc(v)}</small></div></li>` : '';
        $('#sr').innerHTML = x.status === 'read' && x.score != null
          ? `<h3>${esc(x.business)} <span class="pill${x.solid ? '' : ' bad'}">Score ${esc(x.score)}${x.solid ? ', solid' : ''}</span></h3><ul class="list">${line('Niche', x.niche)}${line('Phone', x.phone)}${line('ZIP', x.zip)}${line('Email', (x.emails || []).join(', '))}${line('Gates', (x.gates || []).join(', ') || 'none')}${line('Why', (x.why || []).join('; '))}${line('Pages read', (ev.pagesRead || []).join(', '))}</ul><p class="muted">${r.staged === 'staged' ? 'Staged below in Recent sweeps. Open it to add it.' : r.staged === 'duplicate' ? 'That phone is already an account.' : 'No phone in a New Jersey or Tennessee ZIP was found, so nothing was staged.'}</p>${r.staged === 'staged' ? `<p><a class="btn sm" href="#engine/${esc(r.id)}">Open to add</a></p>` : ''}`
          : `<p class="note">${esc(x.note || x.status)}</p>`;
      }, (err) => { $('#sr').innerHTML = ''; fail(err); }).finally(() => { btn.disabled = false; });
    };
    $('#ef').onsubmit = (e) => { e.preventDefault(); const f = form(e.target); api('/engine/jobs', { method: 'POST', body: { zip: f.zip, niche: f.niche, cap: Number(f.cap) || undefined } }).then((r) => { toast(r.message); location.hash = 'engine/' + r.id; route(); }, fail); };
    if ($('#addAll')) $('#addAll').onclick = () => api('/engine/jobs/' + encodeURIComponent(open.id) + '/add', { method: 'POST', body: {} }).then((r) => { toast(`Added ${r.added}${r.duplicates ? `, ${r.duplicates} already on file` : ''}${r.skipped ? `, ${r.skipped} need a fix` : ''}`); route(); }, fail);
    if ($('#rs')) $('#rs').onclick = (e) => {
      const a = e.target.closest('[data-add]'), n = e.target.closest('[data-no]');
      if (a) api('/engine/results/' + encodeURIComponent(a.dataset.add) + '/add', { method: 'POST', body: {} }).then(() => { toast('Added'); route(); }, fail);
      if (n) api('/engine/results/' + encodeURIComponent(n.dataset.no) + '/dismiss', { method: 'POST', body: {} }).then(() => { toast('Dismissed'); route(); }, fail);
    };
    if (jobs.some((j) => j.status === 'running' || j.status === 'queued') && cfg.connected) screens.engine.t = setTimeout(() => { if (location.hash.startsWith('#engine')) route(); }, 20000);
  },
};

function fillView() { if (ME.role !== 'admin') return; $('#vw').innerHTML = `<option value="">All reps</option>${repOptions(VIEW, false)}`; $('#vw').value = VIEW; }
function setView(v) { VIEW = v; try { localStorage.setItem('rep.view', v); } catch {} fillView(); }

// Call Room binds a keydown shortcut while it is the active screen; every other screen must not see it.
let callsKeyHandler = null;
function clearCallsKey() { if (callsKeyHandler) { document.removeEventListener('keydown', callsKeyHandler); callsKeyHandler = null; } }

// Top-level groups. Hash routes are unchanged; a tab's third value marks it admin only.
const GROUPS = [
  { key: 'home', tabs: [['today', 'Today']] },
  { key: 'sales', tabs: [['calls', 'Call Room'], ['pipeline', 'Pipeline'], ['accounts', 'Accounts']] },
  { key: 'learn', tabs: [['playbook', 'Playbook'], ['kit', 'Toolkit'], ['how', 'How it works']] },
  { key: 'deals', tabs: [['deals', 'My deals']] },
  { key: 'team', tabs: [['team', 'Team'], ['engine', 'Lead Engine', true]] },
];
async function route() {
  // Leads now lives in Accounts; old #leads links land there.
  if (location.hash === '#leads') history.replaceState(null, '', '#accounts');
  const [name, arg] = (location.hash.slice(1) || 'today').split('/');
  if (name !== 'calls') clearCallsKey();
  const fn = screens[name] && !name.endsWith('Panel') ? screens[name] : screens.today;
  const tab = ['account', 'deal', 'orderform'].includes(name) ? 'accounts' : name === 'calendar' ? 'today' : name, g = GROUPS.find((x) => x.tabs.some((t) => t[0] === tab));
  $$('#nav a').forEach((l) => { if (g && l.dataset.g === g.key) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  const tabs = g ? g.tabs.filter((t) => !t[2] || ME.role === 'admin') : [];
  $('#subnav').hidden = tabs.length < 2;
  $('#subnav').innerHTML = tabs.length < 2 ? '' : tabs.map(([k, label]) => `<a href="#${k}"${k === tab ? ' aria-current="page"' : ''}>${label}</a>`).join('');
  try { await fn(arg); } catch (e) { view.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  scrollTo(0, 0);
}

(async () => {
  try { [ME, K] = await Promise.all([api('/me'), api('/content')]); }
  catch (e) { view.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  $('#who').textContent = ME.name; $('#navTeam').hidden = ME.role !== 'admin';
  if (ME.role === 'admin') {
    try { VIEW = localStorage.getItem('rep.view') || ''; } catch { VIEW = ''; }
    try { REPS = (await api('/reps')).reps; } catch { REPS = []; }
    if (VIEW && !REPS.some((r) => r.email === VIEW)) VIEW = '';
    fillView(); $('#viewbar').hidden = false;
    $('#vw').onchange = () => { setView($('#vw').value); route(); };
  }
  addEventListener('hashchange', route); route();
})();
</script>
