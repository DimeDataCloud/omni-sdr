<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F100E" media="(prefers-color-scheme: dark)"><title>Rep portal · OmniSDR</title>
<style nonce="__NONCE__">__CSS__
nav.main{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;border-bottom:1px solid var(--line);scrollbar-width:none}nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:0 0 auto;min-height:44px;display:flex;align-items:center;padding:0 12px;color:var(--muted);font-weight:600;text-decoration:none;border-bottom:3px solid transparent}
nav.main a[aria-current=page]{color:var(--text);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1 1 200px}
.stack{display:grid;gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat b{display:block;font-size:26px;line-height:32px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}
.list .t{flex:1 1 220px;min-width:0}.list .t small{display:block;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
a.lnk,button.lnk{color:var(--ink);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start}
.col h2{display:flex;justify-content:space-between;margin:0 0 2px}.col h2 span{color:var(--muted);font-variant-numeric:tabular-nums}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}.mini select{min-height:40px;padding:4px 8px;font-size:16px}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.outcomes .btn[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
.script{white-space:pre-wrap}details{border-top:1px solid var(--line);padding:8px 0}details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.phone{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.tbl{overflow-x:auto;overscroll-behavior-x:contain}.tbl tr[data-id]{cursor:pointer}
@media (hover:hover){.tbl tr[data-id]:hover td{background:color-mix(in srgb,var(--fill) 12%,transparent)}}
/* iOS Safari */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@supports (-webkit-touch-callout:none){body{background-attachment:scroll}} /* fixed backgrounds jank and repaint on iOS */
header.top{padding-top:calc(8px + env(safe-area-inset-top))}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0;accent-color:var(--ink);flex:0 0 auto}
input[type=datetime-local],input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;display:block}
input::-webkit-date-and-time-value{text-align:left;min-height:22px}
input[type=search]{-webkit-appearance:none;appearance:none}
@media (pointer:coarse){.btn.sm{min-height:44px;padding:0 14px}nav.main a{min-height:48px}a.lnk,button.lnk{padding:6px 0}}
nav.main,.board{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}nav.main a,.board .col{scroll-snap-align:start}
dialog{max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}
.day h2{margin:12px 0 4px}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);z-index:5}
.fields{display:grid;gap:0 16px}@media(min-width:700px){.fields{grid-template-columns:1fr 1fr}}.fields .full{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);width:min(560px,calc(100% - 32px));padding:20px}dialog::backdrop{background:rgba(0,0,0,.4)}
.timeline li{display:block}.timeline small{color:var(--muted)}
.flow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:0 0 16px}.flow .card ul{margin:0;padding-left:18px;color:var(--muted)}.flow .core{border-color:var(--ink)}
main>.card,main>section.card,main>.grid{margin-bottom:16px}
.tpl{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;user-select:text}
.est{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}.tight{margin:0;padding-left:20px}
ol.path{margin:0;padding-left:22px;display:grid;gap:10px}ol.path li b{display:block}ol.path li span{display:block;max-width:72ch}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">__LOGO__<b>OmniSDR · Rep</b></div><span class="muted" id="who"></span></header>
<nav class="main" id="nav" aria-label="Rep portal">
  <a href="#today">Today</a><a href="#calls">Call Room</a><a href="#pipeline">Pipeline</a><a href="#accounts">Accounts</a><a href="#calendar">Calendar</a><a href="#deals">My deals</a><a href="#playbook">Playbook</a><a href="#kit">Toolkit</a><a href="#how">How it works</a><a href="#team" hidden id="navTeam">Team</a>
</nav>
<main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script nonce="__NONCE__">
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
let ME = null, K = null; // who is signed in; content (prices, playbook, stages)

async function api(path, { method = 'GET', body, raw = false } = {}) {
  const r = await fetch('/rep/api' + path, { method, credentials: 'same-origin', headers: { 'x-rep': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (raw && r.ok) return r;
  const j = await r.json().catch(() => ({ message: 'The server sent something unexpected.' }));
  if (r.status === 401) { location.reload(); throw new Error('Signed out'); } // Access sends them to sign in again
  if (!r.ok) throw new Error(j.message || 'Something went wrong.');
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
const fail = (e) => toast(e.message);
const when = (iso) => iso ? new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const day = (iso) => new Date(iso).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
const local = (iso) => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromLocal = (v) => v ? new Date(v).toISOString() : null;
const label = (code) => String(code).replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
const STAGE_LABEL = { new: 'New', contacted: 'Contacted', audit_run: 'Free check run', results_call: 'Results call', proposed: 'Proposed', signed: 'Signed', onboarding: 'Onboarding', live: 'Live', lost: 'Lost' };
const money = (c) => '$' + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const form = (f) => Object.fromEntries(new FormData(f).entries());
const ul = (items, cls = 'tight') => `<ul class="${cls}">${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
const ol = (items) => `<ol class="tight">${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ol>`;
// Fill {business}, {name} and {rep}; anything in [brackets] is left for the rep to fill in.
const fill = (body, v) => body.replace(/\{(business|name|rep)\}/g, (m, k) => v[k] || m);
const tpls = (v) => K.templates.map((t) => `<section class="card stack"><h2>${esc(t.label)}</h2><pre class="tpl" id="tp_${t.id}">${esc(fill(t.body, v))}</pre>
  <div class="row"><button class="btn ghost sm" type="button" data-copy="tp_${t.id}">Copy</button>${v.account ? `<button class="btn ghost sm" type="button" data-sent="${t.id}">Log it as sent</button>` : ''}</div></section>`).join('');
async function copyText(id) {
  const el = document.getElementById(id); if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent); toast('Copied'); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Copy it now.'); }
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });

// The lost-job estimate on the Audit tab, from the owner's own numbers (strings as typed, maybe empty).
// Return the sentence to show, or '' when there is not enough to say anything.
// Christian 2026-10-27: no doubt words and no promises. State the owner's own math and call it theirs.
function lostJobs(jobValue, missed) {
  // "$8,500" -> 8500; a range like "3-4" takes the low end so the figure never overstates.
  const num = (v) => { const m = String(v || '').replace(/[$,\s]/g, '').match(/\d+(\.\d+)?/); return m ? Number(m[0]) : 0; };
  const value = Math.round(num(jobValue)), leads = Math.floor(num(missed)); // whole dollars, whole leads
  if (!value || !leads) return '';
  const cents = Math.round(value * leads * 100);
  return `By your numbers: ${leads} missed ${leads === 1 ? 'lead' : 'leads'} a month × ${money(Math.round(value * 100))} a job = ${money(cents)} a month in jobs at stake.`;
}

// Which accounts the Today screen calls "hot": open deals worth a call today.
// a has: stage, last_touch_at, next_action_at, updated_at, created_at (ISO strings or null), signal, next_step.
function isHot(a, now = Date.now()) {
  // Christian 2026-10-27: money on the table (results call, proposal) is always hot; a lead reached in the last 48 hours is warm.
  if (!['results_call', 'proposed'].includes(a.stage)) return a.stage === 'contacted' && Date.parse(a.last_touch_at) > now - 2 * 864e5;
  return true;
}

/* ---------- screens ---------- */
const screens = {
  async today() {
    const [t, all] = await Promise.all([api('/today'), api('/accounts')]);
    const hot = all.accounts.filter((a) => isHot(a)).slice(0, 8);
    view.innerHTML = `<h1>Today</h1><p class="sub">Calls, callbacks and follow-ups due by end of day.</p>
      <div class="stats" id="stats"></div>
      <div class="grid two"><section class="card"><h2>Due today (${t.tasks.length})</h2><ul class="list" id="due"></ul></section>
      <section class="card"><h2>Hot accounts</h2><ul class="list" id="hot"></ul></section></div>`;
    const s = t.stages;
    $('#stats').innerHTML = [['Calls today', t.counts.attempts], ['Conversations', t.counts.conversations], ['Interested', t.counts.interested], ['Open pipeline', ['new', 'contacted', 'audit_run', 'results_call', 'proposed'].reduce((n, k) => n + (s[k] || 0), 0)], ['Signed or live', (s.signed || 0) + (s.onboarding || 0) + (s.live || 0)]]
      .map(([k, v]) => `<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join('');
    $('#due').innerHTML = t.tasks.length ? t.tasks.map((k) => `<li><div class="t">${esc(k.title)}<small>${k.business ? esc(k.business) + ' · ' : ''}${when(k.due_at)}${Date.parse(k.due_at) < Date.now() - 36e5 ? ' · overdue' : ''}</small></div>
      <span class="row">${k.account_id ? `<a class="btn ghost sm" href="#account/${esc(k.account_id)}">Open</a>` : ''}<button class="btn sm" data-done="${esc(k.id)}">Done</button></span></li>`).join('') : '<li class="muted">Nothing due. Work the Call Room queue.</li>';
    $('#hot').innerHTML = hot.length ? hot.map((a) => `<li><div class="t"><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a><small>${STAGE_LABEL[a.stage]}${a.next_step ? ' · ' + esc(a.next_step) : ''}</small></div></li>`).join('') : '<li class="muted">No hot accounts right now.</li>';
    $('#due').onclick = (e) => { const b = e.target.closest('[data-done]'); if (b) api('/tasks/' + b.dataset.done, { method: 'PATCH', body: { status: 'done' } }).then(() => { toast('Done'); route(); }, fail); };
  },

  async calls() {
    const { accounts } = await api('/queue');
    let i = 0, outcome = null;
    const draw = () => {
      const a = accounts[i];
      if (!a) { view.innerHTML = `<h1>Call Room</h1><div class="card"><p>The queue is empty. Add accounts or import a list on the Accounts screen.</p><a class="btn" href="#accounts">Go to Accounts</a></div>`; return; }
      outcome = null;
      view.innerHTML = `<h1>Call Room</h1><p class="sub">${i + 1} of ${accounts.length} due. One at a time.</p>
      <div class="grid two"><section class="card stack">
        <div><h2>${esc(a.business)}</h2><p class="muted">${esc([a.niche, a.city, a.state].filter(Boolean).join(' · '))} · <span class="pill">${STAGE_LABEL[a.stage]}</span></p></div>
        ${a.phone ? `<div><span class="phone">${esc(a.phone)}</span> <a class="lnk" href="tel:${esc(a.phone.replace(/[^\d+]/g, ''))}">Call</a></div>` : '<p class="note">No phone on file. Add one on the account.</p>'}
        ${a.contact_name ? `<p>Ask for <b>${esc(a.contact_name)}</b></p>` : ''}
        ${a.signal ? `<p><span class="muted">Why we are calling:</span> ${esc(a.signal)}</p>` : ''}
        ${a.notes ? `<p class="muted script">${esc(a.notes)}</p>` : ''}
        <div><h2>How did it go?</h2><div class="outcomes" id="oc">${K.outcomes.map((o) => `<button class="btn ghost" data-o="${o}" aria-pressed="false">${label(o)}</button>`).join('')}</div></div>
        <div id="cbBox" hidden><label for="cb">Callback time</label><input type="datetime-local" id="cb"></div>
        <div><label for="cn">Note</label><textarea id="cn" rows="3" maxlength="1000" placeholder="What they said, who to ask for, best time"></textarea></div>
        <div class="row"><button class="btn" id="log" disabled>Log call and next</button><button class="btn ghost" id="skip">Skip</button><a class="lnk" href="#account/${esc(a.id)}">Open account</a></div>
      </section>
      <section class="card stack"><h2>Opener</h2><p class="script">${esc(K.opener)}</p>
        <div>${K.objections.map((o) => `<details><summary>${esc(o.heard)}</summary><p>${esc(o.answer)}</p></details>`).join('')}</div>
        <p class="note">${esc(K.method)}</p></section></div>`;
      $('#oc').onclick = (e) => { const b = e.target.closest('[data-o]'); if (!b) return; outcome = b.dataset.o; $$('#oc [data-o]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); $('#cbBox').hidden = outcome !== 'callback_scheduled'; $('#log').disabled = false; };
      $('#skip').onclick = () => { i++; draw(); };
      $('#log').onclick = async () => {
        $('#log').disabled = true;
        try { const r = await api('/calls', { method: 'POST', body: { accountId: a.id, outcome, note: $('#cn').value, callbackAt: fromLocal($('#cb').value) } });
          toast(r.task ? `Logged. Next: ${r.task.title}, ${when(r.task.dueAt)}` : 'Logged'); i++; draw();
        } catch (e) { fail(e); $('#log').disabled = false; }
      };
    };
    draw();
  },

  async pipeline() {
    const { accounts } = await api('/accounts');
    const stages = K.stages.filter((s) => s !== 'lost');
    view.innerHTML = `<h1>Pipeline</h1><p class="sub">Change the stage on a card to move it. Onboarding and Live are set by Christian.</p><div class="board" id="board">${stages.map((st) => {
      const list = accounts.filter((a) => a.stage === st);
      return `<section class="col"><h2>${STAGE_LABEL[st]}<span>${list.length}</span></h2>${list.map((a) => `<div class="mini"><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a>
        <small class="muted">${esc(a.next_step || a.niche || '')}</small><select data-id="${esc(a.id)}" aria-label="Stage for ${esc(a.business)}">${K.stages.map((s) => `<option value="${s}"${s === a.stage ? ' selected' : ''}${['onboarding', 'live'].includes(s) && ME.role !== 'admin' ? ' disabled' : ''}>${STAGE_LABEL[s]}</option>`).join('')}</select></div>`).join('')}</section>`;
    }).join('')}</div>`;
    $('#board').onchange = (e) => { const s = e.target.closest('select[data-id]'); if (s) api('/accounts/' + s.dataset.id, { method: 'PATCH', body: { stage: s.value } }).then(() => { toast('Moved'); route(); }, fail); };
  },

  async accounts() {
    view.innerHTML = `<h1>Accounts</h1><p class="sub">Every business you are working, prospect to live.</p>
      <div class="card stack"><div class="row"><input class="grow" id="q" type="search" placeholder="Search name, niche, city or phone" aria-label="Search accounts">
        <select id="st" aria-label="Stage" class="grow"><option value="">All stages</option>${K.stages.map((s) => `<option value="${s}">${STAGE_LABEL[s]}</option>`).join('')}</select></div>
        <div class="row"><button class="btn" id="add">New account</button><label class="btn ghost" for="csv">Import CSV</label><input id="csv" type="file" accept=".csv,text/csv" class="sr"><button class="btn ghost" id="exp">Export CSV</button></div>
        <div class="tbl"><table><thead><tr><th>Business</th><th>Stage</th><th>Next</th><th>Phone</th></tr></thead><tbody id="rows"></tbody></table></div></div>
      <dialog id="dlg"><form id="nf" class="stack"><h2>New account</h2><div class="fields">
        <div class="full"><label for="nb">Business name</label><input id="nb" name="business" required maxlength="160"></div>
        <div><label for="nn">Niche</label><input id="nn" name="niche" maxlength="80" placeholder="Remodeler, HVAC, med spa"></div>
        <div><label for="np">Phone</label><input id="np" name="phone" type="tel" maxlength="40"></div>
        <div><label for="nc">Owner or contact</label><input id="nc" name="contact" maxlength="120"></div>
        <div><label for="nw">Website</label><input id="nw" name="website" maxlength="300"></div>
        <div><label for="ny">City</label><input id="ny" name="city" maxlength="80"></div>
        <div><label for="ns">State</label><input id="ns" name="state" maxlength="40"></div>
        <div class="full"><label for="ng">Why we are calling (the signal)</label><input id="ng" name="signal" maxlength="300" placeholder="Form went unanswered 6 hours on a Tuesday"></div>
      </div><div class="row"><button class="btn">Save</button><button class="btn ghost" type="button" id="cx">Cancel</button></div></form></dialog>`;
    const load = async () => {
      const p = new URLSearchParams(); if ($('#q').value.trim()) p.set('q', $('#q').value.trim()); if ($('#st').value) p.set('stage', $('#st').value);
      const { accounts } = await api('/accounts?' + p);
      $('#rows').innerHTML = accounts.length ? accounts.map((a) => `<tr data-id="${esc(a.id)}"><td><a class="lnk" href="#account/${esc(a.id)}">${esc(a.business)}</a><br><small class="muted">${esc([a.niche, a.city].filter(Boolean).join(' · '))}</small></td><td>${STAGE_LABEL[a.stage]}</td><td>${esc(a.next_step)}<br><small class="muted">${when(a.next_action_at)}</small></td><td>${esc(a.phone)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">No accounts match.</td></tr>';
    };
    let tq; $('#q').oninput = () => { clearTimeout(tq); tq = setTimeout(() => load().catch(fail), 250); }; $('#st').onchange = () => load().catch(fail);
    $('#rows').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('a')) location.hash = 'account/' + tr.dataset.id; };
    $('#add').onclick = () => $('#dlg').showModal(); $('#cx').onclick = () => $('#dlg').close();
    $('#nf').onsubmit = async (e) => { e.preventDefault(); const f = form(e.target);
      try { const r = await api('/accounts', { method: 'POST', body: { ...f, contact: f.contact ? { name: f.contact } : null } }); $('#dlg').close(); location.hash = 'account/' + r.account.id; } catch (er) { fail(er); } };
    $('#csv').onchange = async (e) => { const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      if (file.size > 500000) return toast('That file is over 500 KB. Split it.');
      try { const r = await api('/import', { method: 'POST', body: { csv: await file.text() } });
        if (r.errors.length) toast(`Nothing imported. Row ${r.errors[0].row}: ${r.errors[0].message}` + (r.errors.length > 1 ? ` (+${r.errors.length - 1} more)` : '')); else { toast(`Imported ${r.imported}`); load(); }
      } catch (er) { fail(er); } };
    $('#exp').onclick = async () => { try { const r = await api('/export.csv', { raw: true }); const url = URL.createObjectURL(await r.blob()); const a = Object.assign(document.createElement('a'), { href: url, download: 'omnisdr-accounts.csv' }); a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); } catch (er) { fail(er); } };
    await load();
  },

  async account(id) {
    const d = await api('/accounts/' + encodeURIComponent(id)), a = d.account;
    const levels = K.prices.levels.filter((l) => l.level > 0);
    view.innerHTML = `<p><a class="lnk" href="#accounts">All accounts</a></p><h1>${esc(a.business)}</h1><p class="sub"><span class="pill">${STAGE_LABEL[a.stage]}</span> ${esc([a.niche, a.city, a.state].filter(Boolean).join(' · '))}</p>
      <div class="tabs" role="tablist">${[['Details', 0], ['Audit', 4], ['Messages', 5], ['Timeline', 1], ['Onboarding', 2], ['Close', 3]].map(([t, k]) => `<button class="tab" role="tab" data-t="${k}" aria-selected="${k === 0}">${t}</button>`).join('')}</div>
      <div data-p="0" class="grid two"><form class="card" id="ef"><div class="fields">
        ${[['business', 'Business name', 'full'], ['niche', 'Niche'], ['phone', 'Phone'], ['email', 'Email'], ['website', 'Website', 'full'], ['address', 'Address', 'full'], ['city', 'City'], ['state', 'State'], ['signal', 'Why we are calling', 'full'], ['next_step', 'Next step', 'full']]
          .map(([k, l, c]) => `<div class="${c || ''}"><label for="f_${k}">${l}</label><input id="f_${k}" name="${k}" value="${esc(a[k])}"></div>`).join('')}

        </div><div class="row"><button class="btn">Save</button>${a.stage !== 'lost' ? '<button class="btn ghost" type="button" id="lost">Mark lost</button>' : ''}</div></form>
        <div class="stack"><section class="card"><h2>People</h2><ul class="list" id="ppl">${d.contacts.map((c) => `<li><div class="t">${esc(c.name)}${c.is_primary ? ' <span class="pill">Primary</span>' : ''}<small>${esc([c.role, c.phone, c.email].filter(Boolean).join(' · '))}</small></div><button class="btn ghost sm" data-del="${esc(c.id)}">Remove</button></li>`).join('') || '<li class="muted">No one yet.</li>'}</ul>
          <form id="cf" class="fields"><div><label for="c_n">Name</label><input id="c_n" name="name" required maxlength="120"></div><div><label for="c_r">Role</label><input id="c_r" name="role" maxlength="80" placeholder="Owner, office manager"></div>
          <div><label for="c_p">Phone</label><input id="c_p" name="phone" type="tel"></div><div><label for="c_e">Email</label><input id="c_e" name="email" type="email"></div>
          <div class="full row"><label class="row"><input type="checkbox" name="isPrimary" class="cb"> Primary contact</label><button class="btn ghost">Add person</button></div></form></section>
        <section class="card"><h2>Open tasks</h2><ul class="list">${d.tasks.map((k) => `<li><div class="t">${esc(k.title)}<small>${when(k.due_at)}</small></div></li>`).join('') || '<li class="muted">None.</li>'}</ul></section></div></div>
      <div data-p="1" hidden class="card stack"><form id="nt" class="row"><select name="kind" aria-label="Kind" class="grow"><option value="note">Note</option><option value="email">Email sent</option><option value="text">Text sent</option><option value="demo">Demo given</option></select><input name="body" class="grow" required maxlength="2000" placeholder="What happened" aria-label="Note"><button class="btn">Add</button></form>
        <ul class="list timeline">${d.activities.map((v) => `<li><small>${when(v.created_at)} · ${esc(label(v.kind))}</small><div>${esc(v.body)}</div></li>`).join('')}</ul></div>
      <form data-p="4" hidden class="card stack" id="af"><p class="sub">Step 2 of the path: research the business and run the free check before the demo. Their numbers, not ours.</p>
        <details><summary>How to run the free check</summary>${ol(K.auditSteps)}</details>
        ${[...new Set(K.auditFields.map((x) => x.group))].map((g) => `<h2>${esc(g)}</h2><div class="fields">${K.auditFields.filter((x) => x.group === g).map((x) => x.num
          ? `<div><label for="u_${x.key}">${esc(x.label)}</label><input id="u_${x.key}" name="${x.key}" inputmode="decimal" maxlength="40" value="${esc(a.audit[x.key])}"></div>`
          : `<div class="full"><label for="u_${x.key}">${esc(x.label)}</label><textarea id="u_${x.key}" name="${x.key}" rows="2" maxlength="1000">${esc(a.audit[x.key])}</textarea></div>`).join('')}</div>`).join('')}
        <p class="est" id="est"></p><p class="note">${esc(K.resultsDont)}</p>
        <div class="row"><button class="btn">Save audit</button>${['new', 'contacted'].includes(a.stage) ? '<button class="btn ghost" type="button" id="aRun">Save and mark free check run</button>' : ''}</div></form>
      <div data-p="5" hidden class="stack"><p class="sub">Starter wording with this account filled in. Adjust it, copy it, send it from your own phone or email, then log it.</p>${tpls({ business: a.business, name: ((d.contacts.find((c) => c.is_primary) || d.contacts[0] || {}).name || '').split(' ')[0] || 'there', rep: (ME.name || '').split(' ')[0], account: true })}</div>
      <form data-p="2" hidden class="card" id="of"><p class="sub">Fill this in with the owner on the call after the yes. The developer starts from it.</p><div class="fields">${K.onboarding.map((f) => `<div class="full"><label for="o_${f.key}">${esc(f.label)}</label><textarea id="o_${f.key}" name="${f.key}" rows="2" maxlength="1000">${esc(a.onboarding[f.key])}</textarea></div>`).join('')}</div><button class="btn">Save onboarding</button></form>
      <div data-p="3" hidden class="card stack">${d.deals.length ? `<p>Closed: ${d.deals.map((x) => `Level ${x.level}, ${money(x.price_cents)}${x.price_is_draft ? ' (draft price)' : ''}, ${when(x.closed_at)}`).join('; ')}</p>` : ''}
        ${['signed', 'onboarding', 'live'].includes(a.stage) ? '<p class="muted">This account is signed. Next is the Onboarding tab.</p>' : `<form id="df" class="stack"><label for="lv">What they bought</label><select id="lv" name="level">${levels.map((l) => `<option value="${l.level}">${esc(l.label)}: ${l.level === 1 ? 'from ' + money(l.amountCents) : l.amountCents != null ? money(l.amountCents) : 'priced by Christian'}</option>`).join('')}</select>
          <div id="pbox" hidden><label for="pc" id="plbl">Agreed price in dollars (admin)</label><input id="pc" name="price" inputmode="decimal"><p class="note" id="psplit"></p></div>
          <label for="dn">Notes</label><input id="dn" name="notes" maxlength="1000"><p class="note">${K.prices.isFinal ? '' : 'Prices are DRAFT until Christian sets them. '}${esc(K.taxNote)} No discounts.</p><button class="btn">Close the sale</button></form>`}</div>`;
    const tabs = $$('.tab'); tabs.forEach((t) => (t.onclick = () => { tabs.forEach((x) => x.setAttribute('aria-selected', String(x === t))); $$('[data-p]').forEach((p) => (p.hidden = p.dataset.p !== t.dataset.t)); }));
    const save = (body, msg) => api('/accounts/' + a.id, { method: 'PATCH', body }).then(() => { toast(msg); route(); }, fail);
    $('#ef').onsubmit = (e) => { e.preventDefault(); const f = form(e.target); f.next_action_at = fromLocal(f.next_action_at); save(f, 'Saved'); };
    if ($('#lost')) $('#lost').onclick = () => save({ stage: 'lost' }, 'Marked lost');
    $('#of').onsubmit = (e) => { e.preventDefault(); save({ onboarding: form(e.target) }, 'Onboarding saved'); };
    const est = () => { $('#est').textContent = lostJobs($('#u_jobValue').value, $('#u_missed').value); };
    $('#af').oninput = est; est();
    $('#af').onsubmit = (e) => { e.preventDefault(); save({ audit: form(e.target) }, 'Audit saved'); };
    if ($('#aRun')) $('#aRun').onclick = () => save({ audit: form($('#af')), stage: 'audit_run' }, 'Audit saved. Stage: free check run');
    $('[data-p="5"]').onclick = (e) => { const b = e.target.closest('[data-sent]'); if (!b) return; const t = K.templates.find((x) => x.id === b.dataset.sent);
      api(`/accounts/${a.id}/notes`, { method: 'POST', body: { kind: t.kind === 'call' ? 'note' : t.kind, body: 'Sent: ' + t.label } }).then(() => toast('Logged on the timeline'), fail); };
    $('#cf').onsubmit = (e) => { e.preventDefault(); const f = form(e.target); api(`/accounts/${a.id}/contacts`, { method: 'POST', body: { ...f, isPrimary: !!f.isPrimary } }).then(() => { toast('Added'); route(); }, fail); };
    $('#ppl').onclick = (e) => { const b = e.target.closest('[data-del]'); if (b) api('/contacts/' + b.dataset.del, { method: 'DELETE' }).then(() => { toast('Removed'); route(); }, fail); };
    $('#nt').onsubmit = (e) => { e.preventDefault(); api(`/accounts/${a.id}/notes`, { method: 'POST', body: form(e.target) }).then(() => { toast('Added'); route(); }, fail); };
    const df = $('#df');
    if (df) {
      const sync = () => { const l = levels.find((x) => x.level === Number($('#lv').value)), pilot = l.level === 1;
        $('#pbox').hidden = !(pilot || (l.amountCents == null && ME.role === 'admin'));
        $('#plbl').textContent = pilot ? 'Pilot price in dollars, $499 minimum' : 'Agreed price in dollars (admin)';
        if (pilot && !$('#pc').value) $('#pc').value = String(K.pilot.minCents / 100); split(); };
      const split = () => { const c = Math.round(parseFloat($('#pc').value) * 100), pilot = Number($('#lv').value) === 1;
        if (!pilot || !(c >= K.pilot.minCents)) { $('#psplit').textContent = pilot ? 'The pilot starts at $499.' : ''; return; }
        const al = Math.round((c * K.pilot.allowanceRate) / 500) * 500, each = Math.round((c - c * K.pilot.feeRate - al) / 2);
        $('#psplit').textContent = `Allowance ${money(al)}. You and the developer, about ${money(Math.round(each / 100) * 100)} each (draft).`; };
      $('#pc').oninput = split;
      $('#lv').onchange = sync; sync();
      df.onsubmit = (e) => { e.preventDefault(); const f = form(df), cents = f.price ? Math.round(parseFloat(f.price) * 100) : undefined;
        api('/deals', { method: 'POST', body: { accountId: a.id, level: Number(f.level), notes: f.notes, priceCents: cents } }).then(() => { toast('Sale closed. Fill in onboarding next.'); route(); }, fail); };
    }
  },

  async calendar() {
    const { tasks } = await api('/tasks');
    const byDay = {}; for (const k of tasks) (byDay[new Date(k.due_at).toDateString()] ||= []).push(k);
    view.innerHTML = `<h1>Calendar</h1><p class="sub">Open tasks, last week through the next five.</p>
      <form class="card fields" id="tf"><div class="full"><label for="t_t">New task</label><input id="t_t" name="title" required maxlength="200" placeholder="Send the results summary"></div>
        <div><label for="t_d">Due</label><input id="t_d" name="dueAt" type="datetime-local" required></div><div><label for="t_k">Kind</label><select id="t_k" name="kind"><option value="follow_up">Follow-up</option><option value="callback">Callback</option><option value="demo">Demo</option><option value="onboarding">Onboarding</option></select></div>
        <div class="full"><button class="btn">Add task</button></div></form>
      <div id="days">${Object.keys(byDay).length ? Object.entries(byDay).map(([k, list]) => `<section class="day"><h2>${day(list[0].due_at)}</h2><div class="card"><ul class="list">${list.map((t) => `<li><div class="t">${esc(t.title)}<small>${new Date(t.due_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}${t.business ? ' · ' + esc(t.business) : ''}</small></div><span class="row">${t.account_id ? `<a class="btn ghost sm" href="#account/${esc(t.account_id)}">Open</a>` : ''}<button class="btn sm" data-done="${esc(t.id)}">Done</button></span></li>`).join('')}</ul></div></section>`).join('') : '<p class="muted">Nothing scheduled.</p>'}</div>`;
    $('#tf').onsubmit = (e) => { e.preventDefault(); const f = form(e.target); api('/tasks', { method: 'POST', body: { ...f, dueAt: fromLocal(f.dueAt) } }).then(() => { toast('Added'); route(); }, fail); };
    $('#days').onclick = (e) => { const b = e.target.closest('[data-done]'); if (b) api('/tasks/' + b.dataset.done, { method: 'PATCH', body: { status: 'done' } }).then(() => { toast('Done'); route(); }, fail); };
  },

  async deals() {
    const { deals } = await api('/deals'), admin = ME.role === 'admin';
    const pay = (x) => x.level === 1 && x.eachCents != null ? 'about ' + money(Math.round(x.eachCents / 100) * 100) : 'Set when Christian prices it';
    view.innerHTML = `<h1>My deals</h1><p class="sub">Every sale you closed, newest first. Pay figures are draft until prices are final.</p>
      <div class="stats"><div class="card stat"><b>${deals.length}</b><span>Closed</span></div><div class="card stat"><b>${deals.filter((x) => x.stage === 'live').length}</b><span>Live</span></div><div class="card stat"><b>${money(deals.reduce((n, x) => n + x.price_cents, 0))}</b><span>Sold, before tax</span></div></div>
      <section class="card"><div class="tbl"><table><thead><tr><th>Business</th><th>Level</th><th>Price</th><th>Closed</th><th>Stage</th><th>Your pay, each (draft)</th>${admin ? '<th>Rep</th>' : ''}</tr></thead><tbody>${deals.length ? deals.map((x) => `<tr><td><a class="lnk" href="#account/${esc(x.account_id)}">${esc(x.business)}</a></td><td>${x.level}</td><td>${money(x.price_cents)}</td><td>${when(x.closed_at)}</td><td>${STAGE_LABEL[x.stage] || ''}</td><td>${esc(pay(x))}</td>${admin ? `<td>${esc(x.rep_email)}</td>` : ''}</tr>`).join('') : `<tr><td colspan="${admin ? 7 : 6}" class="muted">No closed deals yet. The pilot is the first yes.</td></tr>`}</tbody></table></div>
      <p class="note">${esc(K.pay.note)}</p></section>`;
  },

  async kit() {
    const Q = K.qualify, D = K.discovery, Y = K.afterYes, W = K.daily;
    view.innerHTML = `<h1>Toolkit</h1><p class="sub">Messages, who to sell to, discovery, the free check, after the yes, and your day.</p>
      <section class="card stack"><h2>Who we sell to</h2><div class="tbl"><table><thead><tr><th>Niche</th><th>The outcome to sell</th></tr></thead><tbody>${Q.niches.map((n) => `<tr><td>${esc(n.niche)}</td><td>${esc(n.line)}</td></tr>`).join('')}</tbody></table></div>
        <div class="grid two"><div><h2>Signals to look for</h2>${ul(Q.signals)}</div><div><h2>Skip</h2>${ul(Q.skip)}</div><div><h2>Green flags</h2>${ul(Q.green)}</div><div><h2>Red flags</h2>${ul(Q.red)}<p class="note">${esc(Q.redRule)}</p></div></div></section>
      <h2>Message templates</h2><p class="muted">Open an account and use its Messages tab to get these with the name and business filled in.</p>
      <div class="grid two">${tpls({ rep: (ME.name || '').split(' ')[0] })}</div>
      <section class="card stack"><h2>Discovery</h2><p class="script">${esc(D.opener)}</p><div class="tbl"><table><thead><tr><th>Ask</th><th>What it tells you</th></tr></thead><tbody>${D.questions.map((q) => `<tr><td>${esc(q.ask)}</td><td>${esc(q.tells)}</td></tr>`).join('')}</tbody></table></div><p class="note">${esc(D.tip)}</p></section>
      <div class="grid two"><section class="card stack"><h2>The free check</h2>${ol(K.auditSteps)}</section>
        <section class="card stack"><h2>The results call</h2>${ol(K.resultsCall)}<p><b>Say this.</b> ${esc(K.resultsSay)}</p><p class="note">${esc(K.resultsDont)}</p></section>
        <section class="card stack"><h2>When the owner is nervous</h2><p>${esc(K.safety.line)}</p><p class="note">${esc(K.safety.dont)}</p></section>
        <section class="card stack"><h2>After the yes</h2><p class="muted">What the owner provides</p>${ul(Y.owner)}<p class="muted">Go-live checklist</p>${ul(Y.golive)}<p>${esc(Y.timeline)}</p><p class="note">${esc(Y.rule)}</p></section>
        <section class="card stack"><h2>Your day</h2><p>${esc(W.day)}</p><p class="muted">Log every day</p>${ul(W.log)}<div class="tbl"><table><thead><tr><th>For</th><th>Ask</th></tr></thead><tbody>${W.who.map((x) => `<tr><td>${esc(x.what)}</td><td>${esc(x.who)}</td></tr>`).join('')}</tbody></table></div></section>
        <section class="card stack"><h2>Brand</h2>${ul(K.brand)}<h2>Links</h2><div class="row">${K.resources.map((r) => `<a class="btn ghost sm" href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.label)}</a>`).join('')}</div></section></div>
      <section class="card"><h2>Words you will hear</h2><div class="tbl"><table><tbody>${K.glossary.map(([t, d]) => `<tr><td><b>${esc(t)}</b></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div></section>`;
  },

  async playbook() {
    const G = K.pricingGuide, quoteRule = (lv) => (G.quote.find((q) => q.level === lv) || {}).rule || '';
    view.innerHTML = `<h1>Playbook</h1><p class="sub">The path to a yes, the pricing guide, what to say, and what never to say.</p>
      <section class="card stack"><h2>The path to a yes</h2><ol class="path">${K.path.map((s) => `<li><b>${esc(s.title)}</b><span class="muted">${esc(s.body)}</span></li>`).join('')}</ol><p class="note">${esc(K.pathGate)}</p></section>
      <div class="grid two">
      <section class="card stack"><h2>Pricing guide</h2><p class="note">${esc(G.lede)}</p>
        <div class="tbl"><table><thead><tr><th>Level</th><th>What</th><th>Price (draft)</th><th>Can you quote it?</th></tr></thead><tbody>${K.prices.levels.map((l) => `<tr><td>${l.level}. ${esc(l.label)}</td><td>${esc(l.what)}</td><td>${l.amountCents === 0 ? 'Free' : l.amountCents != null ? (l.level === 1 ? 'From ' : '') + money(l.amountCents) + (l.unit === 'one_time' ? ' plus tax' : '') : l.level === 4 ? '$999 a month and up' : 'Not quoted yet'}</td><td>${esc(quoteRule(l.level))}</td></tr>`).join('')}</tbody></table></div>
        <p><b>The rule.</b> ${esc(G.rule)}</p><p><b>Say this.</b> ${esc(G.say)}</p><p class="muted">${esc(K.taxNote)}</p></section>
      <section class="card stack"><h2>Opener</h2><p class="script">${esc(K.opener)}</p><h2>Objections</h2><p class="muted">${esc(K.method)}</p><div>${K.objections.map((o) => `<details><summary>${esc(o.heard)}</summary><p>${esc(o.answer)}</p></details>`).join('')}</div></section>
      <section class="card stack"><h2>Never say</h2><ul>${K.never.map((n) => `<li>${esc(n)}</li>`).join('')}</ul><div class="tbl"><table><thead><tr><th>Instead of</th><th>Say</th></tr></thead><tbody>${K.swaps.map((s) => `<tr><td>${esc(s.instead)}</td><td>${esc(s.say)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="card stack"><h2>Demo</h2><ol>${K.demoSteps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol><p class="note">${esc(K.demoLimits)}</p><a class="btn" href="/tryme" target="_blank" rel="noopener">Open the live demo</a>
        <h2>Your pay</h2><p>${esc(K.pay.note)}</p>
        <div class="tbl"><table><thead><tr><th>Plan</th><th>Allowance</th><th>You and the developer, each</th></tr></thead><tbody>${(K.pay.table || []).map((r) => `<tr><td>${esc(r.plan)}</td><td>${esc(r.allowance)}</td><td>${esc(r.each)}</td></tr>`).join('')}</tbody></table></div></section></div>`;
  },

    const H = K.how, card = (t, b) => `<section class="card stack"><h2>${esc(t)}</h2><p class="muted">${esc(b)}</p></section>`;
    view.innerHTML = `<h1>How it works</h1><p class="sub">${esc(H.lede)}</p>
      <div class="flow">${H.flow.map((n, k) => `<section class="card stack${k === 2 ? ' core' : ''}"><h2>${esc(n.title)}</h2><ul>${n.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></section>`).join('')}</div>
      <section class="card"><h2>The ways we answer</h2><div class="tbl"><table><thead><tr><th>Channel</th><th>What happens</th><th>Status</th></tr></thead><tbody>${H.channels.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.what)}</td><td><span class="pill ${c.tone}">${esc(c.status)}</span></td></tr>`).join('')}</tbody></table></div>
        <p class="note">Sell what is ready. Promise no start date and no channel that is not live.</p></section>
      <div class="grid two">${H.examples.map((e) => card(e.title, e.body)).join('')}</div>
      <div class="grid two">${H.sections.map((x) => card(x.title, x.body)).join('')}
        <section class="card stack"><h2>Every lead ends in one of these</h2><p class="row">${H.ends.map((e) => `<span class="pill">${esc(e)}</span>`).join('')}</p><p class="muted">${esc(H.endsNote)}</p></section></div>
      <section class="card stack"><h2>Say this</h2><p>${esc(H.say)}</p><a class="btn" href="/tryme" target="_blank" rel="noopener">Open the live demo</a></section>`;
  },

  async team() {
    if (ME.role !== 'admin') { location.hash = 'today'; return; }
    const { reps } = await api('/reps');
    view.innerHTML = `<h1>Team</h1><p class="sub">Who can sign in. They also need to be on the Cloudflare Access list.</p><div class="grid two">
      <section class="card"><ul class="list" id="reps">${reps.map((r) => `<li><div class="t">${esc(r.name)} <span class="pill${r.active ? '' : ' bad'}">${r.active ? esc(r.role) : 'off'}</span><small>${esc(r.email)}</small></div>${r.email === ME.email ? '' : `<button class="btn ghost sm" data-e="${esc(r.email)}" data-a="${r.active ? 0 : 1}">${r.active ? 'Turn off' : 'Turn on'}</button>`}</li>`).join('')}</ul></section>
      <form class="card" id="rf"><h2>Add a rep</h2><label for="r_n">Name</label><input id="r_n" name="name" required maxlength="80"><label for="r_e">Email they sign in with</label><input id="r_e" name="email" type="email" required>
        <label for="r_r">Role</label><select id="r_r" name="role"><option value="rep">Rep</option><option value="admin">Admin</option></select><p><button class="btn">Add</button></p></form></div>`;
    $('#reps').onclick = (e) => { const b = e.target.closest('[data-e]'); if (b) api('/reps/' + encodeURIComponent(b.dataset.e), { method: 'PATCH', body: { active: b.dataset.a === '1' } }).then(() => { toast('Updated'); route(); }, fail); };
    $('#rf').onsubmit = (e) => { e.preventDefault(); api('/reps', { method: 'POST', body: form(e.target) }).then(() => { toast('Added'); route(); }, fail); };
  },
};

async function route() {
  const [name, arg] = (location.hash.slice(1) || 'today').split('/');
  const fn = screens[name] || screens.today;
  $$('#nav a').forEach((l) => { if (l.getAttribute('href') === '#' + (name === 'account' ? 'accounts' : name)) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  try { await fn(arg); } catch (e) { view.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  scrollTo(0, 0);
}

(async () => {
  try { [ME, K] = await Promise.all([api('/me'), api('/content')]); }
  catch (e) { view.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  $('#who').textContent = ME.name; $('#navTeam').hidden = ME.role !== 'admin';
  addEventListener('hashchange', route); route();
})();
</script>
</body></html>
