<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#F7F5F0"><title>Omni-SDR</title>
<style nonce="__NONCE__">__CSS__
.bubble{max-width:88%;padding:10px 12px;border-radius:12px;margin:0 0 8px;white-space:pre-wrap}
.bubble.a{background:var(--ok-soft);color:var(--text);border-bottom-left-radius:4px}
.bubble.u{background:var(--bg);border:1px solid var(--line);margin-left:auto;border-bottom-right-radius:4px}
.bubble.t{display:flex;gap:5px;align-items:center;min-height:42px}.bubble.t i{width:7px;height:7px;border-radius:50%;background:var(--control);animation:hop .5s ease infinite alternate}.bubble.t i:nth-child(2){animation-delay:.12s}.bubble.t i:nth-child(3){animation-delay:.24s}
.bubble.in{animation:pop .25s ease both}
#log{height:min(52vh,420px);overflow:auto;padding:4px 2px;display:flex;flex-direction:column}
.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1}
.chat{max-width:480px;margin:6vh auto 0;animation:open .25s ease both}
.replies{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.rb{min-height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--text);font-weight:600;cursor:pointer}.rb:hover{background:var(--ok-soft)}
.out-row{margin-top:10px;text-align:right}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes hop{to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.chat,.bubble.in{animation:none}.bubble.t i{animation:none}}
</style></head><body data-mode="__MODE__"><div class="wrap">
<header class="top"><div class="brand">__LOGO__<b>Omni-SDR</b></div></header>
<main class="card chat"><div id="log" role="log" aria-live="polite"></div>__PANEL__</main>
</div>
<script nonce="__NONCE__">
(function(){'use strict';
var mode=document.body.getAttribute('data-mode'),log=document.getElementById('log');
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function put(n){log.appendChild(n);log.scrollTop=1e9;return n}
// Agent line: a typing indicator first, then the text. With reduced motion the text just appears.
function say(t){return new Promise(function(done){
 if(calm){put(el('div','bubble a',t));return done()}
 var d=put(el('div','bubble a t'));d.appendChild(el('i'));d.appendChild(el('i'));d.appendChild(el('i'));
 setTimeout(function(){d.className='bubble a in';d.textContent=t;log.scrollTop=1e9;done()},650)})}
function you(t){put(el('div','bubble u',t))}
function choices(){var r=el('div','replies');r.setAttribute('role','group');r.setAttribute('aria-label','Choose where to go');
 [['Try me','/tryme'],['Sales','/sales']].forEach(function(c){var b=el('button','rb',c[0]);b.type='button';b.addEventListener('click',function(){location.assign(c[1])});r.appendChild(b)});put(r);var f=r.firstChild;if(f)f.focus()}
var so=document.getElementById('so');
if(so)so.addEventListener('click',function(){fetch('/api/sales/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(function(){location.reload()})});
if(mode==='portal'){say('Welcome back.').then(function(){return say('Where to?')}).then(choices);return}
var f=document.getElementById('lf'),p=document.getElementById('pc'),sb=document.getElementById('sb'),busy=false;
function lock(v){p.disabled=v;sb.disabled=v}
say('Hi, this is Omni-SDR.').then(function(){return say('Type the passcode to come in.')}).then(function(){p.focus()});
f.addEventListener('submit',function(ev){ev.preventDefault();if(busy||!p.value)return;busy=true;lock(true);
 var body=JSON.stringify({passcode:p.value});p.value='';you('\u2022\u2022\u2022\u2022\u2022\u2022');
 fetch('/api/sales/login',{method:'POST',headers:{'content-type':'application/json'},body:body}).then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
 .then(function(x){
  if(x.s===200&&x.j.ok){f.hidden=true;return say('That works. Welcome in.').then(function(){return say('Where to?')}).then(choices)}
  if(x.s===429){return say('That is a lot of tries. Please wait 15 minutes and try again.')}
  return say('That did not match. Try again.').then(function(){busy=false;lock(false);p.focus()})})
 .catch(function(){return say('I could not reach the server. Try again in a moment.').then(function(){busy=false;lock(false);p.focus()})})})
})();
</script></body></html>
