<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#F7F5F0"><title>Sales · Omni-SDR</title>
<style nonce="__NONCE__">__CSS__
.login{max-width:380px;margin:12vh auto 0}.u-mb12{margin-bottom:12px}.u-mt12{margin-top:12px}.u-full-mt18{width:100%;margin-top:18px}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">__LOGO__<b>Omni-SDR · Sales</b></div></header>
<section class="login card"><h1>Sales deck</h1><p class="sub u-mb12">Enter the passcode to open the deck.</p>
 <form id="lf"><label for="pc">Passcode</label><input id="pc" type="password" autocomplete="current-password" required><div id="le" class="err u-mt12" role="alert" hidden></div>
 <button class="btn u-full-mt18" type="submit">Open</button></form></section>
</div>
<script nonce="__NONCE__">
(function(){'use strict';
var f=document.getElementById('lf'),e=document.getElementById('le'),p=document.getElementById('pc');
function fail(t){e.textContent=t;e.hidden=false}
f.addEventListener('submit',function(ev){ev.preventDefault();e.hidden=true;
fetch('/api/sales/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({passcode:p.value})})
.then(function(r){return r.json().then(function(j){if(r.ok&&j.ok){p.value='';location.reload()}else fail(j.message||'Could not sign in.')})})
.catch(function(){fail('Could not reach the server.')})})})();
</script></body></html>
