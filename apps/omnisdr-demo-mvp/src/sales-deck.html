<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#F7F5F0"><title>Sales deck · Omni-SDR</title>
<style nonce="__NONCE__">__CSS__
.deck{max-width:960px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:16px}
.slide{flex:1;padding:32px}.slide h1{font-size:32px;line-height:40px;margin:0 0 16px}.slide p{font-size:18px;line-height:28px;margin:0 0 12px}.slide ul{font-size:18px;line-height:28px;padding-left:22px;margin:0 0 12px}
.nav{display:flex;align-items:center;gap:12px}.nav .grow{flex:1}.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ink)}
.notes{padding:16px;border:1px dashed var(--control);border-radius:12px;background:var(--surface)}.notes h2{margin:0 0 6px}.notes p{margin:0 0 8px;white-space:pre-wrap}
.printall{display:none}
@media print{body{background:#fff;color:#000}.deck{display:none}.printall{display:block}.ps{break-inside:avoid;page-break-after:always;padding:24px 0}.ps h1{font-size:26px}.ps p,.ps li{font-size:14px;line-height:22px}.ps .pn{border-top:1px solid #999;margin-top:12px;padding-top:8px;color:#333}}
</style></head><body>
<div class="deck" id="deck">
 <header class="top"><div class="brand">__LOGO__<b>Omni-SDR · Sales</b></div><span><button class="btn ghost" id="bn" aria-pressed="false">Notes (N)</button> <button class="btn ghost" id="bp">Print</button> <button class="btn ghost" id="bo">Sign out</button></span></header>
 <main class="card slide" id="slide" aria-live="polite"></main>
 <section class="notes" id="notes" hidden><h2>Speaker notes</h2><div id="nt"></div></section>
 <div class="prog" role="progressbar" aria-label="Progress" id="pg"><i id="pgi"></i></div>
 <nav class="nav"><button class="btn ghost" id="bb">Back</button><span class="grow muted" id="ct"></span><button class="btn" id="bx">Next</button></nav>
</div>
<div class="printall" id="pa"></div>
<script type="application/json" id="sd" nonce="__NONCE__">__SLIDES__</script>
<script nonce="__NONCE__">
(function(){'use strict';
var S=JSON.parse(document.getElementById('sd').textContent),i=0,$=function(x){return document.getElementById(x)};
function el(t,x){var n=document.createElement(t);if(x!=null)n.textContent=x;return n}
function fill(host,s,h){host.appendChild(el(h,s.title));s.body.forEach(function(b){if(typeof b==='string'){host.appendChild(el('p',b))}else if(b&&b.list){var u=el('ul');b.list.forEach(function(x){u.appendChild(el('li',x))});host.appendChild(u)}})}
function go(n){i=Math.max(0,Math.min(S.length-1,n));var s=S[i],m=$('slide');m.textContent='';fill(m,s,'h1');
$('nt').textContent='';String(s.notes||'').split('\n').forEach(function(l){$('nt').appendChild(el('p',l))});
$('ct').textContent=(i+1)+' of '+S.length;$('pgi').style.width=((i+1)/S.length*100)+'%';$('bb').disabled=i===0;$('bx').disabled=i===S.length-1;
$('pg').setAttribute('aria-valuenow',String(i+1));$('pg').setAttribute('aria-valuemin','1');$('pg').setAttribute('aria-valuemax',String(S.length));
try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function notes(){var n=$('notes');n.hidden=!n.hidden;$('bn').setAttribute('aria-pressed',String(!n.hidden))}
var pa=$('pa');S.forEach(function(s,k){var d=el('section');d.className='ps';fill(d,s,'h1');var n=el('div');n.className='pn';n.appendChild(el('p','Notes: '+String(s.notes||'')));d.appendChild(n);pa.appendChild(d)});
$('bb').addEventListener('click',function(){go(i-1)});$('bx').addEventListener('click',function(){go(i+1)});
$('bn').addEventListener('click',notes);$('bp').addEventListener('click',function(){window.print()});
$('bo').addEventListener('click',function(){fetch('/api/sales/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(function(){location.reload()})});
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key;
if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(i+1)}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(i-1)}else if(k==='Home'){go(0)}else if(k==='End'){go(S.length-1)}else if(k==='n'||k==='N'){notes()}});
var h=parseInt(location.hash.slice(1),10);go(h>0?h-1:0)})();
</script></body></html>
