name: db-tests

# The schema's guarantees (RLS, tenant FKs, claims gate, send guard, credits) are proved by
# packages/db's suite; the claims gate by packages/gate's. gate imports db's helpers, so db installs first. It runs on every PR and every push to master; a red run blocks merge.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [db, gate, sender]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      - run: npm ci --prefix ../db
        if: matrix.package != 'db'
      - run: npm ci
      - run: npm test
